[workspace]
members = [
  "rust/crates/robine-application",
  "rust/crates/robine-core",
  "rust/crates/robine-oidc",
  "rust/crates/robine-persistence",
  "rust/crates/robine-server",
]
resolver = "3"

[workspace.package]
version = "0.3.0"
edition = "2024"
license = "AGPL-3.0-or-later"
rust-version = "1.97"

[workspace.dependencies]
actix-web = "4.11"
argon2 = "0.5"
async-trait = "0.1"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["chrono", "derive", "json", "postgres", "runtime-tokio-rustls", "uuid"] }
subtle = "2.6"
thiserror = "2.0"
getrandom = "0.3"
hmac = "0.12"
openidconnect = { version = "4.0", features = ["reqwest"] }
tokio = { version = "1.47", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
uuid = { version = "1.18", features = ["serde", "v4"] }
url = "2.5"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "deny"
pedantic = "deny"
