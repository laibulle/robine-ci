[workspace]
members = [
  "rust/crates/robine-application",
  "rust/crates/robine-core",
  "rust/crates/robine-execution",
  "rust/crates/robine-oidc",
  "rust/crates/robine-persistence",
  "rust/crates/robine-secrets",
  "rust/crates/robine-source",
  "rust/crates/robine-storage",
  "rust/crates/robine-workflows",
  "rust/crates/robine-server",
]
resolver = "3"

[workspace.package]
version = "0.3.0"
edition = "2024"
license = "AGPL-3.0-or-later"
rust-version = "1.97"

[workspace.dependencies]
actix-web = "4.11"
actix-ws = "0.3"
aes-gcm = "0.10"
argon2 = "0.5"
async-trait = "0.1"
aws-config = "1.8"
aws-sdk-s3 = "1.142"
base64 = "0.22"
flate2 = "1.1"
futures-util = "0.3"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml_ng = "0.10"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["chrono", "derive", "json", "postgres", "runtime-tokio-rustls", "uuid"] }
subtle = "2.6"
thiserror = "2.0"
tar = "0.4"
getrandom = "0.3"
hmac = "0.12"
jsonwebtoken = "9.3"
openidconnect = { version = "4.0", features = ["reqwest"] }
percent-encoding = "2.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1.47", features = ["io-util", "macros", "process", "rt-multi-thread", "signal", "sync", "time"] }
uuid = { version = "1.18", features = ["serde", "v4"] }
url = "2.5"
zeroize = "1.8"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "deny"
pedantic = "deny"
