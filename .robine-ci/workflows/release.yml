version: 1
name: Robine Release

on:
  push:
    tags: ["v*"]

jobs:
  package:
    image: elixir@sha256:7ee41a9a8a8427dbd40c9133ee5b9047f585b58db4968fd675fbcd9498e3b22e
    shell: /bin/bash
    timeout: 20m
    env:
      MIX_ENV: cli
      ERL_FLAGS: "+S 4:4"
      MAKEFLAGS: "-j4"
    steps:
      - name: Checkout tagged revision
        uses: checkout
      - name: Install build tooling
        run: |
          mix local.hex --force
          mix local.rebar --force
          mix deps.get
      - name: Build CLI release
        run: mix robine.release --output dist
      - name: Build runner release
        run: mix robine.runner_release --output dist/runner
      - name: Upload GitHub release payload
        uses: artifacts/upload
        with:
          name: github-release
          paths: [dist]
          retention-days: 30
