version: 1
name: Robine Release

on:
  push:
    tags: ["v*"]

jobs:
  package:
    image: hexpm/elixir@sha256:1d7b070659ac993d5778b605bf767bc2477faedaea26f09bfa945d5e91d5fa14
    shell: /bin/bash
    timeout: 20m
    env:
      ERL_FLAGS: "+S 4:4"
      MAKEFLAGS: "-j4"
    steps:
      - name: Checkout tagged revision
        uses: checkout
      - name: Install build tooling
        run: |
          rm -f /etc/apt/apt.conf.d/docker-clean
          mkdir -p /tmp/robine-apt/cache/archives/partial /tmp/robine-apt/state/lists/partial /tmp/robine-apt/log
          APT_OPTIONS=(
            -o APT::Sandbox::User=root
            -o Dir::Cache=/tmp/robine-apt/cache
            -o Dir::State=/tmp/robine-apt/state
            -o Dir::State::status=/var/lib/dpkg/status
            -o Dir::Log=/tmp/robine-apt/log
            -o Dir::Log::Terminal=/dev/null
            -o Dpkg::Use-Pty=0
          )
          export DEBIAN_FRONTEND=noninteractive
          apt-get "${APT_OPTIONS[@]}" update
          apt-get "${APT_OPTIONS[@]}" install --yes --no-install-recommends build-essential ca-certificates curl git
          rm -rf /tmp/robine-apt
          curl -fsSL https://go.dev/dl/go1.27.0.linux-amd64.tar.gz -o /tmp/go.tgz
          echo "675c26c449cbb18fc24b74650de1eabbae6e16f64326fd85a283fb3b58280685  /tmp/go.tgz" | sha256sum -c -
          tar --no-same-owner -xzf /tmp/go.tgz -C /usr/local
          rm /tmp/go.tgz
          ln -sf /usr/local/go/bin/go /usr/local/bin/go
          go version
          mix local.hex --force
          mix local.rebar --force
          mix deps.get
      - name: Build CLI release
        run: MIX_ENV=cli mix robine.release --output dist/cli
      - name: Build runner release
        run: MIX_ENV=cli mix robine.runner_release --output dist/runner
      - name: Build self-contained Go runner releases
        run: MIX_ENV=cli mix robine.go_runner_release --output dist/runner-go
      - name: Build server release
        run: |
          mkdir -p "$PWD/.robine-tmp"
          TMPDIR="$PWD/.robine-tmp" MIX_ENV=prod mix robine.server_release --output dist/server
      - name: Upload server release archive
        uses: artifacts/upload
        with:
          name: github-release-robine-server-${{ runner.os }}-${{ runner.arch }}
          paths: [dist/server]
          retention-days: 30
      - name: Upload CLI release archive
        uses: artifacts/upload
        with:
          name: github-release-robine-cli-${{ runner.os }}-${{ runner.arch }}
          paths: [dist/cli]
          retention-days: 30
      - name: Upload runner release archive
        uses: artifacts/upload
        with:
          name: github-release-robine-runner-${{ runner.os }}-${{ runner.arch }}
          paths: [dist/runner]
          retention-days: 30
      - name: Upload macOS runner release binaries
        uses: artifacts/upload
        with:
          name: github-release-robine-runner-macos-multiarch
          paths: [dist/runner-go/macos]
          retention-days: 30
      - name: Upload Linux runner release binaries
        uses: artifacts/upload
        with:
          name: github-release-robine-runner-linux-multiarch
          paths: [dist/runner-go/linux]
          retention-days: 30
      - name: Upload Windows runner release binaries
        uses: artifacts/upload
        with:
          name: github-release-robine-runner-windows-multiarch
          paths: [dist/runner-go/windows]
          retention-days: 30
