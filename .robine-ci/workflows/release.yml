version: 1
name: Robine Release

on:
  push:
    tags: ["v*"]

jobs:
  package:
    image: rust:1.97-bookworm
    shell: /bin/bash
    timeout: 30m
    steps:
      - name: Checkout tagged revision
        uses: checkout
      - name: Install pinned static Docker client
        run: |
          curl -fsSL https://download.docker.com/linux/static/stable/x86_64/docker-28.5.2.tgz -o /tmp/docker.tgz
          echo "ea90cfd12e1eeb12aa1c971741adb8bd4ed88e2a574eaac13f5029a1dbc6300d  /tmp/docker.tgz" | sha256sum -c -
          tar --no-same-owner -xzf /tmp/docker.tgz -C /usr/local/bin --strip-components=1 docker/docker
          rm /tmp/docker.tgz
      - name: Build native release
        run: cargo run --release -p robine-package -- --output dist
      - name: Verify native checksums
        run: |
          cd dist
          sha256sum --check SHA256SUMS
          for component in cli server runner; do (cd "$component" && sha256sum --check SHA256SUMS); done
      - name: Upload server release
        uses: artifacts/upload
        with:
          name: github-release-robine-server-${{ runner.os }}-${{ runner.arch }}
          paths: [dist/server]
          retention-days: 30
      - name: Upload CLI release
        uses: artifacts/upload
        with:
          name: github-release-robine-cli-${{ runner.os }}-${{ runner.arch }}
          paths: [dist/cli]
          retention-days: 30
      - name: Upload runner release
        uses: artifacts/upload
        with:
          name: github-release-robine-runner-${{ runner.os }}-${{ runner.arch }}
          paths: [dist/runner]
          retention-days: 30
