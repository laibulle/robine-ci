version: 1
name: Robine CI

on:
  push:
    branches: [main]
  pull_request: {}
  workflow_dispatch: {}

jobs:
  verify:
    image: elixir@sha256:7ee41a9a8a8427dbd40c9133ee5b9047f585b58db4968fd675fbcd9498e3b22e
    timeout: 20m
    env:
      MIX_ENV: test
      ERL_FLAGS: "+S 4:4"
      MAKEFLAGS: "-j4"
      ROBINE_TEST_DATABASE_HOST: postgres
    services:
      postgres:
        image: postgres:18-alpine
        user: postgres
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: robine_test
        readiness:
          tcp: 5432
          timeout: 45s
    steps:
      - name: Checkout
        uses: checkout
      - name: Prepare Mix tooling
        run: mix local.hex --force && mix local.rebar --force
      - name: Restore Mix cache
        uses: cache/restore
        with:
          key: robine-mix-${{ checksum('mix.lock') }}
          paths: [deps, _build]
      - name: Install dependencies
        run: mix deps.get
      - name: Run project precommit
        run: mix precommit
      - name: Save Mix cache
        uses: cache/save
        with:
          key: robine-mix-${{ checksum('mix.lock') }}
          paths: [deps, _build]
