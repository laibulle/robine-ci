version: 1
name: Robine CI

on:
  push:
    branches: [main]
  pull_request: {}
  workflow_dispatch: {}

jobs:
  verify:
    image: rust:1.97-bookworm
    shell: /bin/bash
    timeout: 30m
    env:
      ROBINE_DATABASE_INTEGRATION_URL: postgres://postgres:postgres@postgres/robine_test
      DOCKER_HOST: tcp://docker:2375
      DOCKER_TLS_CERTDIR: ""
    services:
      docker:
        image: docker:28-dind
        privileged: true
        env:
          DOCKER_TLS_CERTDIR: ""
        command: ["--tls=false"]
        readiness:
          tcp: 2375
          timeout: 60s
      postgres:
        image: postgres:18-alpine
        user: postgres
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: robine_test
        readiness:
          tcp: 5432
          timeout: 45s
    steps:
      - name: Checkout
        uses: checkout
      - name: Install Docker client
        run: |
          curl -fsSL https://download.docker.com/linux/static/stable/x86_64/docker-28.5.2.tgz -o /tmp/docker.tgz
          echo "ea90cfd12e1eeb12aa1c971741adb8bd4ed88e2a574eaac13f5029a1dbc6300d  /tmp/docker.tgz" | sha256sum -c -
          tar --no-same-owner -xzf /tmp/docker.tgz -C /usr/local/bin --strip-components=1 docker/docker
          rm /tmp/docker.tgz
          docker version
      - name: Restore Cargo cache
        uses: cache/restore
        with:
          key: robine-cargo-${{ checksum('Cargo.lock') }}
          paths: [target, /usr/local/cargo/registry, /usr/local/cargo/git]
      - name: Verify formatting, lint and tests
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets --all-features -- -D warnings
          cargo test --workspace --all-targets
      - name: Audit Rust dependencies and licenses
        run: |
          cargo install cargo-deny --locked
          cargo deny check advisories licenses bans sources
      - name: Publish coverage marker
        run: |
          cargo install cargo-llvm-cov --locked
          cargo llvm-cov --workspace --all-features --lcov --output-path coverage.lcov
          coverage_total=$(cargo llvm-cov report --summary-only | awk '/TOTAL/{gsub(/%/, "", $10); print $10}' | tail -1)
          test -n "$coverage_total"
          printf 'ROBINE_COVERAGE total=%s threshold=75 report=coverage-report\n' "$coverage_total"
      - name: Upload coverage report
        if: always
        uses: artifacts/upload
        with:
          name: coverage-report
          paths: [coverage.lcov]
          retention-days: 14
      - name: Save Cargo cache
        uses: cache/save
        with:
          key: robine-cargo-${{ checksum('Cargo.lock') }}
          paths: [target, /usr/local/cargo/registry, /usr/local/cargo/git]
