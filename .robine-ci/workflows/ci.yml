version: 1
name: Robine CI

on:
  push:
    branches: [main]
  pull_request: {}
  workflow_dispatch: {}

jobs:
  verify:
    image: elixir@sha256:7ee41a9a8a8427dbd40c9133ee5b9047f585b58db4968fd675fbcd9498e3b22e
    shell: /bin/bash
    timeout: 20m
    env:
      MIX_ENV: test
      ERL_FLAGS: "+S 4:4"
      MAKEFLAGS: "-j4"
      ROBINE_TEST_DATABASE_HOST: postgres
      DOCKER_HOST: tcp://docker:2375
      DOCKER_TLS_CERTDIR: ""
    services:
      docker:
        image: docker:28-dind
        privileged: true
        env:
          DOCKER_TLS_CERTDIR: ""
        command: ["--tls=false"]
        readiness:
          tcp: 2375
          timeout: 60s
      postgres:
        image: postgres:18-alpine
        user: postgres
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: robine_test
        readiness:
          tcp: 5432
          timeout: 45s
    steps:
      - name: Checkout
        uses: checkout
      - name: Prepare Mix tooling
        run: |
          curl -fsSL https://download.docker.com/linux/static/stable/x86_64/docker-28.5.2.tgz -o /tmp/docker.tgz
          echo "ea90cfd12e1eeb12aa1c971741adb8bd4ed88e2a574eaac13f5029a1dbc6300d  /tmp/docker.tgz" | sha256sum -c -
          tar --no-same-owner -xzf /tmp/docker.tgz -C /usr/local/bin --strip-components=1 docker/docker
          rm /tmp/docker.tgz
          docker version
          mix local.hex --force
          mix local.rebar --force
      - name: Restore Mix cache
        uses: cache/restore
        with:
          key: robine-mix-${{ checksum('mix.lock') }}
          paths: [deps]
      - name: Install dependencies
        run: mix deps.get
      - name: Run project verification and coverage
        run: |
          set -euo pipefail
          mix format --check-formatted
          mix compile --warnings-as-errors

          set +e
          mix coverage | tee /tmp/robine-coverage.log
          coverage_status=${PIPESTATUS[0]}
          set -e

          coverage_total=$(awk '/^\[TOTAL\]/{gsub(/%/, "", $2); print $2}' /tmp/robine-coverage.log | tail -1)
          if [[ -n "${coverage_total}" ]]; then
            printf 'ROBINE_COVERAGE total=%s threshold=75 report=coverage-report\n' "${coverage_total}"
          fi

          exit "${coverage_status}"
      - name: Upload coverage report
        if: always
        uses: artifacts/upload
        with:
          name: coverage-report
          paths: [cover]
          retention-days: 14
      - name: Save Mix cache
        uses: cache/save
        with:
          key: robine-mix-${{ checksum('mix.lock') }}
          paths: [deps]
