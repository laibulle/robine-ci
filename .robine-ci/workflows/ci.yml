version: 1
name: Robine CI

on:
  push:
    branches: [main]
  pull_request: {}
  workflow_dispatch: {}

jobs:
  verify:
    image: hexpm/elixir@sha256:2431278a45d8aa9e019202ee73fc50eed21df9b456c4b72ed09b37550b04069b
    shell: /bin/bash
    timeout: 20m
    env:
      MIX_ENV: test
      ERL_FLAGS: "+S 4:4"
      MAKEFLAGS: "-j4"
      ROBINE_TEST_DATABASE_HOST: postgres
      DOCKER_HOST: tcp://docker:2375
      DOCKER_TLS_CERTDIR: ""
    services:
      docker:
        image: docker:28-dind
        privileged: true
        env:
          DOCKER_TLS_CERTDIR: ""
        command: ["--tls=false"]
        readiness:
          tcp: 2375
          timeout: 60s
      postgres:
        image: postgres:18-alpine
        user: postgres
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: robine_test
        readiness:
          tcp: 5432
          timeout: 45s
    steps:
      - name: Checkout
        uses: checkout
      - name: Prepare Mix tooling
        run: |
          curl -fsSL https://download.docker.com/linux/static/stable/x86_64/docker-28.5.2.tgz -o /tmp/docker.tgz
          echo "ea90cfd12e1eeb12aa1c971741adb8bd4ed88e2a574eaac13f5029a1dbc6300d  /tmp/docker.tgz" | sha256sum -c -
          tar --no-same-owner -xzf /tmp/docker.tgz -C /usr/local/bin --strip-components=1 docker/docker
          rm /tmp/docker.tgz
          curl -fsSL https://go.dev/dl/go1.27.0.linux-amd64.tar.gz -o /tmp/go.tgz
          echo "675c26c449cbb18fc24b74650de1eabbae6e16f64326fd85a283fb3b58280685  /tmp/go.tgz" | sha256sum -c -
          tar --no-same-owner -xzf /tmp/go.tgz -C /usr/local
          rm /tmp/go.tgz
          ln -sf /usr/local/go/bin/go /usr/local/bin/go
          docker version
          go version
          mix local.hex --force
          mix local.rebar --force
      - name: Restore Mix cache
        uses: cache/restore
        with:
          key: robine-mix-${{ checksum('mix.lock') }}
          paths: [deps]
      - name: Install dependencies
        run: mix deps.get
      - name: Run project verification and coverage
        run: |
          set -euo pipefail
          mix format --check-formatted
          mix compile --warnings-as-errors

          set +e
          mix coverage | tee /tmp/robine-coverage.log
          coverage_status=${PIPESTATUS[0]}
          set -e

          coverage_total=$(awk '/^\[TOTAL\]/{gsub(/%/, "", $2); print $2}' /tmp/robine-coverage.log | tail -1)
          if [[ -n "${coverage_total}" ]]; then
            printf 'ROBINE_COVERAGE total=%s threshold=75 report=coverage-report\n' "${coverage_total}"
          fi

          exit "${coverage_status}"
      - name: Verify installer syntax
        run: |
          set -euo pipefail
          bash -n priv/static/install/rbe.sh
          docker run --rm -i \
            mcr.microsoft.com/powershell@sha256:042240d57ec9e47e511033b92625a8d95875ee5860af3015992c248b58a8be81 \
            pwsh -NoProfile -Command '$source = [Console]::In.ReadToEnd(); $tokens = $null; $errors = $null; [System.Management.Automation.Language.Parser]::ParseInput($source, [ref]$tokens, [ref]$errors) | Out-Null; if ($errors.Count -gt 0) { $errors | ForEach-Object { Write-Error $_ }; exit 1 }' \
            < priv/static/install/rbe.ps1
      - name: Verify the Go runner release targets
        run: |
          set -euo pipefail
          cd runner-go
          CGO_ENABLED=0 go test ./...
          CGO_ENABLED=0 go test -coverprofile=/tmp/robine-runner.cover ./...
          coverage_total=$(go tool cover -func=/tmp/robine-runner.cover | awk '/^total:/{gsub(/%/, "", $3); print $3}')
          awk -v total="${coverage_total}" 'BEGIN { if (total + 0 < 75) exit 1 }'
          printf 'ROBINE_GO_RUNNER_COVERAGE total=%s threshold=75\n' "${coverage_total}"
          cd ..
          MIX_ENV=cli mix robine.go_runner_release --output /tmp/robine-runner-release
          runner_binary=$(find /tmp/robine-runner-release/linux -type f -name '*-linux-amd64' -print -quit)
          test -n "${runner_binary}"
          ROBINE_GO_RUNNER_TEST_BINARY="${runner_binary}" mix test test/robine/adapters/runner/go_runner_protocol_smoke_test.exs
      - name: Upload coverage report
        if: always
        uses: artifacts/upload
        with:
          name: coverage-report
          paths: [cover]
          retention-days: 14
      - name: Save Mix cache
        uses: cache/save
        with:
          key: robine-mix-${{ checksum('mix.lock') }}
          paths: [deps]
