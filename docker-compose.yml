services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${ROBINE_DEV_DATABASE_NAME:-robine_dev}
      POSTGRES_USER: ${ROBINE_DEV_DATABASE_USER:-postgres}
      POSTGRES_PASSWORD: ${ROBINE_DEV_DATABASE_PASSWORD:-postgres}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "PGPASSWORD=$${POSTGRES_PASSWORD} psql --host=127.0.0.1 --username=$${POSTGRES_USER} --dbname=$${POSTGRES_DB} --no-password --tuples-only --command='SELECT 1' >/dev/null",
        ]
      interval: 2s
      timeout: 3s
      retries: 20
    ports:
      - "127.0.0.1:${ROBINE_DEV_DATABASE_PORT:-5432}:5432"
    volumes:
      - robine_postgres:/var/lib/postgresql

volumes:
  robine_postgres:
