services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: robine_dev
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d robine_dev"]
      interval: 2s
      timeout: 3s
      retries: 20
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - robine_postgres:/var/lib/postgresql

volumes:
  robine_postgres:
