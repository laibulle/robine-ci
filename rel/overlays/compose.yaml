name: robine-ci

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: robine
      POSTGRES_USER: robine
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U robine -d robine"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - postgres_data:/var/lib/postgresql

  server:
    image: ${ROBINE_RUNTIME_IMAGE:?ROBINE_RUNTIME_IMAGE is required}
    restart: unless-stopped
    working_dir: /opt/robine
    env_file:
      - .env
    environment:
      PATH: /opt/robine:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    depends_on:
      postgres:
        condition: service_healthy
    command: ["./robine-server"]
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          /bin/bash -ec 'exec 3<>/dev/tcp/127.0.0.1/4000;
          printf "GET /health/ready HTTP/1.0\r\nHost: localhost\r\n\r\n" >&3;
          head -n 1 <&3 | grep -q " 200 "'
      interval: 2s
      timeout: 3s
      retries: 60
      start_period: 10s
    volumes:
      - ./:/opt/robine:ro
      - storage_data:/var/lib/robine/storage
      - /var/run/docker.sock:/var/run/docker.sock

  proxy:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    environment:
      ROBINE_HOST: ${ROBINE_HOST:?ROBINE_HOST is required}
    depends_on:
      server:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  postgres_data:
  storage_data:
  caddy_data:
  caddy_config:
