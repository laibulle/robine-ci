name: robine-ci

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: robine
      POSTGRES_USER: robine
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U robine -d robine"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - postgres_data:/var/lib/postgresql

  server:
    image: ${ROBINE_RUNTIME_IMAGE:?ROBINE_RUNTIME_IMAGE is required}
    restart: unless-stopped
    working_dir: /opt/robine
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    command:
      - /bin/sh
      - -ec
      - bin/robine eval 'Robine.Runtime.Release.migrate()' && exec bin/robine start
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          /bin/bash -ec 'exec 3<>/dev/tcp/127.0.0.1/4000;
          printf "GET /health/ready HTTP/1.0\r\nHost: localhost\r\n\r\n" >&3;
          head -n 1 <&3 | grep -q " 200 "'
      interval: 2s
      timeout: 3s
      retries: 60
      start_period: 10s
    volumes:
      - ./:/opt/robine:ro
      - storage_data:/var/lib/robine/storage
      - runner_bootstrap:/var/lib/robine-runner-bootstrap

  runner:
    image: docker:28.5.2-cli@sha256:625d9431a9f54c5a2bc90f24f0e1c3d55b1349fd857dd85035f98c2c9acbdd4d
    restart: unless-stopped
    environment:
      ROBINE_PUBLIC_URL: ${ROBINE_PUBLIC_URL:?ROBINE_PUBLIC_URL is required}
      ROBINE_BUNDLED_RUNNER_NAME: ${ROBINE_BUNDLED_RUNNER_NAME:-robine-local}
      ROBINE_RUNNER_RESOURCE_NAMESPACE: ${ROBINE_RUNNER_RESOURCE_NAMESPACE:-production}
      ROBINE_RUNNER_CPU_MILLIS: ${ROBINE_RUNNER_CPU_MILLIS:-2000}
      ROBINE_RUNNER_MEMORY_BYTES: ${ROBINE_RUNNER_MEMORY_BYTES:-4294967296}
      ROBINE_RUNNER_PIDS_LIMIT: ${ROBINE_RUNNER_PIDS_LIMIT:-512}
      ROBINE_TRANSFER_MAX_ARCHIVE_BYTES: ${ROBINE_TRANSFER_MAX_ARCHIVE_BYTES:-268435456}
      ROBINE_RUNNER_READY_FILE: /var/lib/robine-runner/ready
    depends_on:
      server:
        condition: service_healthy
    command: ["/opt/robine/bin/start-bundled-runner"]
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          test -s /var/lib/robine-runner/config.json &&
          test -s /var/lib/robine-runner/ready &&
          pgrep -f '/opt/robine/bin/rbe start --config /var/lib/robine-runner/config.json' >/dev/null
      interval: 2s
      timeout: 3s
      retries: 60
      start_period: 10s
    volumes:
      - ./:/opt/robine:ro
      - runner_state:/var/lib/robine-runner
      - runner_bootstrap:/var/lib/robine-runner-bootstrap
      - /var/run/docker.sock:/var/run/docker.sock

  proxy:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    environment:
      ROBINE_HOST: ${ROBINE_HOST:?ROBINE_HOST is required}
    depends_on:
      server:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  postgres_data:
  storage_data:
  runner_state:
  runner_bootstrap:
  caddy_data:
  caddy_config:
