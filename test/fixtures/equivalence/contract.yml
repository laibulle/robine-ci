version: 1
name: Contract equivalence
on:
  push: {}
jobs:
  verify:
    image: postgres:18-alpine
    shell: /bin/sh
    timeout: 30s
    env:
      MESSAGE: identical-environment
    steps:
      - uses: checkout
      - name: Exit contract
        run: "printf 'env=%s workspace=%s' \"$MESSAGE\" \"$PWD\"; exit 7"
